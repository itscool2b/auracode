# Official releases: signed packages for every target, verified by aura-release and published to
# download.auracode.si. Manual only, from main. The one-time setup (secrets, variables, the
# download domain) and the release steps are in docs/releases.md, "Official releases".
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: staging first (only staging builds read it); stable once a staging build has updated
        type: choice
        options: [staging, stable]
        default: staging
      notes:
        description: Release notes, shown on the download page and in the update prompt
        type: string
        required: true
      publish:
        description: Upload the verified release to download.auracode.si (off builds and verifies only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: check the release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main and every signing input
        env:
          PUBLISH: ${{ inputs.publish }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AURACODE_UPDATER_PUBLIC_KEY: ${{ vars.AURACODE_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are built from main only, not $GITHUB_REF."
            exit 1
          fi
          required=(TAURI_SIGNING_PRIVATE_KEY AURACODE_UPDATER_PUBLIC_KEY
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE)
          if [ "$PUBLISH" = true ]; then required+=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID); fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release configuration (see docs/releases.md): ${missing[*]}"
            exit 1
          fi
          case $APPLE_SIGNING_IDENTITY in
          "Developer ID Application: "*) ;;
          *)
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
            ;;
          esac

  bundle:
    name: bundle (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-26
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          # Ubuntu 22.04: packages built against its glibc run on it and every newer distribution.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      BUNDLE_TARGET: ${{ matrix.target }}
      BUNDLE_FORMATS: ${{ matrix.bundles }}
      AURACODE_UPDATER_CHANNEL: ${{ inputs.channel }}
      AURACODE_UPDATER_PUBLIC_KEY: ${{ vars.AURACODE_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf rpm
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/select-native-perl.ps1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check committed Rust bindings before building the frontend
        run: bash .github/scripts/export-bindings.sh check "$RUNNER_TEMP/bindings-build"
      - name: Select Clang for the Windows ARM64 speech engine
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          Get-Command ninja.exe, clang-cl.exe -ErrorAction Stop | Out-Null
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          $toolchain = Join-Path $env:GITHUB_WORKSPACE '.github/cmake/windows-arm64-clang.cmake'
          "CMAKE_TOOLCHAIN_FILE=$($toolchain.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Build signed bundles (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # The notarization key goes to a private file only for this step.
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" >"$APPLE_API_KEY_PATH")
          unset APPLE_API_PRIVATE_KEY
          pnpm --filter @auracode/desktop bundle --signed-updater --target "$BUNDLE_TARGET" --bundles "$BUNDLE_FORMATS"
          rm -f "$APPLE_API_KEY_PATH"
      - name: Check the macOS signature, notarization and staple
        if: runner.os == 'macOS'
        run: |
          app="target/$BUNDLE_TARGET/release/bundle/macos/auracode.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Install the Azure Artifact Signing client (Windows)
        if: runner.os == 'Windows'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked
      - name: Build signed bundles (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          # Tauri signs the app and the installer with this command; %1 is the file.
          sign="artifact-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d auracode %1"
          config=$(jq -cn --arg sign "$sign" '{bundle: {windows: {signCommand: $sign}}}')
          pnpm --filter @auracode/desktop bundle --signed-updater --target "$BUNDLE_TARGET" --bundles "$BUNDLE_FORMATS" --config "$config"
      - name: Check the Windows installer's Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/$env:BUNDLE_TARGET/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "$($installer.Name) is not validly signed: $($signature.Status)" }
          "$($installer.Name): $($signature.SignerCertificate.Subject)"

      - name: Build signed bundles (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The AppImage tools run from their own extraction instead of needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @auracode/desktop bundle --signed-updater --target "$BUNDLE_TARGET" --bundles "$BUNDLE_FORMATS"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: verify and publish
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Only the stable catalog commit below writes; everything before it reads.
      contents: write
    env:
      AURACODE_UPDATER_PUBLIC_KEY: ${{ vars.AURACODE_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (Wrangler)
        run: pnpm install --frozen-lockfile
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded
          merge-multiple: true
      - name: Write the release plan
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          mkdir "$RUNNER_TEMP/artifacts"
          find "$RUNNER_TEMP/downloaded" -type f -exec mv -n {} "$RUNNER_TEMP/artifacts/" \;
          node .github/scripts/release-plan.mjs "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/plan.json"
      - name: Prepare and verify the release stage
        run: |
          cargo run --locked -p aura-release -- prepare "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/stage"
          cargo run --locked -p aura-release -- verify "$RUNNER_TEMP/stage"
      - name: Keep the manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not release-*: a rerun's download must not pick these up as packages.
          name: stage-manifests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stage/latest.json
            ${{ runner.temp }}/stage/downloads.json
            ${{ runner.temp }}/stage/SHA256SUMS
            ${{ runner.temp }}/stage/release-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish to download.auracode.si
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: cargo run --locked -p aura-release -- publish "$RUNNER_TEMP/stage" --upload
      - name: Point the download page at the stable release
        if: inputs.publish && inputs.channel == 'stable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Main may have moved during the builds: commit on top of it as it is now.
          git fetch --depth 1 "$remote" main
          git checkout -B release-catalog FETCH_HEAD
          cp "$RUNNER_TEMP/stage/downloads.json" apps/web/app/release-catalog.json
          version=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$RUNNER_TEMP/plan.json")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/release-catalog.json
          git commit -m "Release $version: the download page lists it"
          # The site deploys from main, so this push publishes the new download page.
          git push "$remote" HEAD:main
