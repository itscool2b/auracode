# Continuous integration: lint, typecheck and tests for the TypeScript packages; fmt, clippy and
# tests for the Rust workspace; the generated-bindings check; the M0 spikes; and a smoke run of the
# real app in WebKitGTK and WebView2.
#
# What runs when. The repo is private, so hosted-runner minutes are billed with multipliers (Linux
# 1x, Windows 2x, macOS 10x).
# - Pull requests: Linux and Windows.
# - Pushes to milestone branches (m0-scaffold, m1a-core-acp, ...): Linux and Windows. This is how a
#   branch gets its Windows and Linux results before its pull request exists, since a PR is opened
#   only once the work is finished and tested, and Windows cannot be tested locally. Once the branch
#   has an open pull request its pushes skip (the `plan` job checks): the PR's run covers them.
# - Pushes to main and manual runs: Linux, Windows and macOS.
# - Schedule, for breakage that arrives without a commit (a new Rust stable with new clippy lints, a
#   runner image update): Linux every day but Monday, all three on Mondays. These runs do not
#   compare commits, because drift needs no commit and every commit on main already had its push run.
# macOS never runs per PR or per branch push: the developer verifies macOS locally before opening
# each PR, so those runs would mostly repeat that check at ten times the price.
#
# Manual runs (Actions > CI > Run workflow, or `gh workflow run ci.yml --ref <branch>`) work only once
# this file is on the default branch: GitHub ignores workflow_dispatch for a workflow that exists
# only on other branches. Branch pushes have no such limit, which is why they are the pre-PR path.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Milestone branches: an `m`, a digit, anything after (m0-scaffold, m6-website).
      - "m[0-9]*"
  workflow_dispatch:
  schedule:
    # Minute 17 avoids the top of the hour, when GitHub's scheduler is busiest and delays or drops
    # runs. Jobs below compare `github.event.schedule` with these exact strings, and
    # .github/scripts/lint-workflows.sh fails if a comparison names a cron missing here.
    - cron: "17 6 * * 0,2-6" # daily drift check: Linux
    - cron: "17 6 * * 1" # weekly drift check: Linux, Windows, macOS

permissions:
  contents: read

concurrency:
  # Pull requests and milestone-branch pushes share a group per ref, so a newer commit cancels the
  # run it makes obsolete. Every other run (main pushes, schedules, manual runs) gets a group of its
  # own: GitHub keeps one pending run per group and cancels the others even without
  # cancel-in-progress, so a shared group would drop the middle one of three queued main runs.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ride out transient network failures instead of failing a 20 minute job on one bad request.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    # One shell on every runner (Git Bash on Windows), so scripts and `--` arguments behave the
    # same everywhere. PowerShell would be the Windows default.
    shell: bash

jobs:
  # Pushes to milestone branches only: skip the whole run while the branch has an open pull
  # request (.github/scripts/check-open-pr.sh). On every other event this job is skipped, and the
  # jobs that need it still run because their conditions start with `!cancelled()`.
  plan:
    name: plan
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      pull-requests: read # list the branch's open pull requests
    outputs:
      pr_open: ${{ steps.pr.outputs.open }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Look for an open pull request from this branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/check-open-pr.sh

  lint:
    name: lint
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.pr_open != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Setup steps stop the job on failure. The checks after them carry `!cancelled()` so a failing
    # check does not hide the others (one run reports every problem), and they wait for
    # `steps.ready`, the last setup step, so they never run on a half-built environment.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v6.1.0 added pnpm 12 support (the floating v6 tag still pointed at v6.0.10 when this was
      # pinned). No `version` input, so the version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml selects the stable channel with clippy and rustfmt, and this installs
      # exactly that up front (the runner image's preinstalled stable lags behind). rustup still
      # applies the file to every cargo call, so if it is ever pinned to a version, rustup installs
      # that version on its own; change `toolchain` to match to skip the extra download. Pinned to
      # a commit, the action can no longer read the toolchain from its ref name, hence `toolchain`.
      - name: Set up Rust
        id: ready
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test (TypeScript)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm test

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --all --check

      # Every action pinned to a commit, and every schedule comparison naming a scheduled cron.
      - name: Check the workflows
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/lint-workflows.sh

      - name: Check the CI scripts (ShellCheck)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: shellcheck -x .github/scripts/*.sh

      - name: Test the CI scripts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/test.sh

  rust:
    name: rust (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.pr_open != 'true' }}
    strategy:
      # Let Linux finish when Windows fails (and the reverse): the developer cannot reproduce
      # Windows locally, so every result from a run is worth having.
      fail-fast: false
      matrix:
        # Linux alone on the daily drift check; see the top of this file.
        os: ${{ fromJSON(github.event.schedule == '17 6 * * 0,2-6' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A cold Windows run (two vCPUs for private repos) compiles the workspace for clippy, for the
    # tests and for the smoke build; 75 minutes leaves room for that.
    timeout-minutes: 75
    # Shared with rust-macos through a YAML anchor, so the two jobs cannot drift apart. Steps
    # branch on `runner.os`, never on `matrix`, because rust-macos has no matrix. Same setup and
    # check pattern as the lint job.
    steps: &rust_steps
      - name: Keep LF line endings (Windows)
        # Git for Windows checks text files out with CRLF by default. Byte-comparing tests, the
        # bindings check and the bash scripts in .github/scripts would then break on differences
        # that do not exist in the repository. (This comment sits inside the step because zizmor
        # 1.31 crashes on a comment placed between an anchor and the first item of the anchored
        # list.)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri v2's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux), plus Xvfb
      # for the smoke run's display.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      # See the note on this step in the lint job.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Pushes (main and milestone branches) write the cache; before a branch's first merge, main
      # has none to offer it. Pull requests restore main's entries but never save their own, so PR
      # runs cannot evict main's from the repository's 10 GB quota. Saving after a failure keeps
      # the dependency cache current when a new toolchain breaks the nightly. The last setup step,
      # so the checks below wait for it.
      - name: Cache Rust build
        id: ready
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            docs/spikes/windows-spawn -> target
            docs/spikes/claude-control -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'push' }}
          cache-on-failure: true

      # `--locked` fails the run when Cargo.lock is stale instead of silently re-resolving it.
      # Nothing up to the smoke steps needs the frontend: without the custom-protocol feature (only
      # `tauri build` turns it on), `generate_context!` embeds no assets while devUrl is set.
      - name: Clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--no-fail-fast`: cargo otherwise stops at the first failing test binary, hiding failures in
      # the remaining crates (the expensive kind to discover one push at a time on Windows).
      - name: Test
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast

      # Regenerates apps/desktop/src/bindings.ts and fails if the committed file differs. Running
      # on every OS also catches commands that only exist behind a `#[cfg]`, which would make the
      # shared TypeScript file depend on the platform that generated it.
      - name: Check generated TypeScript bindings
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          log="$(mktemp)"
          cargo test --locked -p auracode-desktop export_bindings -- --color never | tee "$log"
          # A renamed, ignored or deleted test would otherwise turn this check into a silent no-op.
          if ! grep -Eq '^test [^ ]*export_bindings[^ ]* \.\.\. ok' "$log"; then
            echo "::error::No passing test matching 'export_bindings' ran in auracode-desktop, so bindings.ts was not regenerated."
            exit 1
          fi
          # `git diff` ignores untracked files, so a never-committed bindings.ts would pass it.
          if ! git ls-files --error-unmatch apps/desktop/src/bindings.ts > /dev/null; then
            echo "::error file=apps/desktop/src/bindings.ts::bindings.ts is not committed. Run 'cargo test -p auracode-desktop export_bindings' and commit it."
            exit 1
          fi
          if ! git diff --exit-code -- apps/desktop/src/bindings.ts; then
            echo "::error file=apps/desktop/src/bindings.ts::bindings.ts is out of date. Run 'cargo test -p auracode-desktop export_bindings' and commit the result."
            exit 1
          fi

      # The Windows spawning spike, on Windows and Linux. Its integration tests run from a staged
      # folder (.github/scripts/stage-spawn-spike.sh), the same folder Windows uploads so the
      # manual checklist in docs/spikes/windows-spawn.md runs on a PC without Rust. The C runtime is
      # linked statically on Windows, so those executables do not need the Visual C++
      # Redistributable on that PC.
      - name: Build the Windows spawning spike
        id: spawn-build
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && runner.os != 'macOS' }}
        timeout-minutes: 20
        env: &spawn_env
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: >-
          cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --no-run
          --message-format=json-render-diagnostics > "$RUNNER_TEMP/windows-spawn-build.jsonl"

      - name: Test the Windows spawning spike (unit tests)
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        timeout-minutes: 10
        env: *spawn_env
        run: cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --lib --bins

      - name: Stage the Windows spawning spike
        id: spawn-stage
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        run: >-
          bash .github/scripts/stage-spawn-spike.sh "$RUNNER_TEMP/windows-spawn-build.jsonl"
          "$RUNNER_TEMP/windows-spawn-spike"

      # From the staged folder, where the helpers are no longer at their build paths, so this also
      # proves the artifact works on its own. The step timeout caps a hung child process, which
      # would otherwise burn the whole job timeout at the Windows 2x rate.
      - name: Test the Windows spawning spike (integration tests)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/windows-spawn-spike
        env:
          TEST_EXE: ${{ steps.spawn-stage.outputs.test_exe }}
        run: '"$TEST_EXE"'

      # Uploaded even when the tests failed: a failure is exactly when the manual check on a real
      # PC matters most.
      - name: Upload the Windows spawning spike (Windows)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spawn-spike-${{ github.sha }}
          path: ${{ runner.temp }}/windows-spawn-spike
          if-no-files-found: error
          retention-days: 7
          # A re-run of the job uploads again under the same name.
          overwrite: true

      # Compile only, never run: running it would drive a real Claude Code session, which needs
      # the CLI, an account and quota, none of which belong in CI.
      - name: Build the Claude control spike (compile only)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo build --manifest-path docs/spikes/claude-control/Cargo.toml --locked

      # The smoke run, on Windows and Linux: the app with its frontend embedded streams through the
      # typed command + Channel path into a real webview (WebView2; WebKitGTK under Xvfb) and
      # reports the result (.github/scripts/run-smoke.sh). It has its own JS setup down here, so a
      # TypeScript error (the lint job reports those) cannot skip the Rust checks above.
      - name: Set up pnpm (smoke)
        id: pnpm
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && runner.os != 'macOS' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (smoke)
        id: node
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (smoke)
        id: js
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      # A debug build without bundles. `tauri build` runs the frontend build (beforeBuildCommand)
      # and turns on the custom-protocol feature that embeds it; most dependencies are already
      # compiled for the tests.
      - name: Build the app with its frontend embedded (smoke)
        id: smoke-build
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        timeout-minutes: 30
        run: pnpm --filter @auracode/desktop tauri build --debug --no-bundle

      # Xvfb has no GPU and no DRM device for WebKitGTK's DMA-BUF renderer, so the variable keeps
      # WebKitGTK on its shared-memory path instead of relying on its detection. The screen fits
      # the window's default size. The app's own watchdog ends a stuck run after 120 s.
      - name: Smoke test the app
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" bash .github/scripts/run-smoke.sh target/debug/auracode
          else
            bash .github/scripts/run-smoke.sh target/debug/auracode.exe
          fi

  rust-macos:
    name: rust (macos-latest)
    # Main, manual runs and the weekly schedule only: see the top of this file. Never skipped as a
    # duplicate, since the `plan` job only runs for milestone-branch pushes, which this job ignores.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * 1'
    runs-on: macos-latest
    timeout-minutes: 60
    steps: *rust_steps
