# Continuous integration: lint, typecheck and tests for the TypeScript packages; fmt, clippy and
# tests for the Rust workspace; the generated-bindings check; the M0 spikes and the check of their
# docs; and smoke runs of the real app in WebKitGTK and WebView2: the stream check, and the chat
# screens against the demo agent.
#
# What runs when. The repo is private, so runner minutes come out of the Free plan's 2,000 included
# minutes a month, billed with multipliers (Linux 1x, Windows 2x, macOS 10x).
# - Pull requests: Linux and Windows.
# - Pushes to milestone branches (m0-scaffold, m1a-core-acp, ...): Linux and Windows. This is how a
#   branch gets its Windows and Linux results before its pull request exists, since a PR is opened
#   only once the work is finished and tested, and Windows cannot be tested locally. Once the branch
#   has an open pull request, its pushes skip (the `plan` job checks) as long as GitHub can merge
#   the PR: the PR's run covers them. GitHub runs no `pull_request` workflow while a PR has a
#   merge conflict, so until that is resolved the pushes run here, or they would get no results.
# - Pushes to main and manual runs: Linux, Windows and macOS.
# - Mondays, for breakage that arrives without a commit (a new Rust stable with new clippy lints, a
#   WebKitGTK or runner image update): the rust job on Linux, and only clippy on Windows, the check
#   such breakage hits first; the rest of the Windows job would more than double the run's price.
#   The lint and powershell jobs skip it: their checks rarely break without a commit, and the next
#   push runs them anyway.
# macOS never runs per PR, per branch push or on the schedule: the developer verifies macOS locally
# before opening each PR, so those runs would mostly repeat that check at ten times the price.
#
# Cost in included minutes. Each job is rounded up to whole minutes, then multiplied. Warm means a
# usable Rust cache; cold means none: after a new Rust stable or lockfile change, after a week with
# no run, and for pull requests until main has saved one (they can read only main's). The ceiling
# is every job running to its timeout. Per job: plan 1, lint 4-6, powershell 2-4, rust on Linux
# 10-30, on Windows 40-100 (clippy alone 10-25), on macOS 40-110. Per event, warm to cold:
# - milestone-branch push: 60-140 (ceiling 265)
# - pull request, when opened and on each push to it: 55-140 (ceiling 260)
# - main push or manual run: 100-250 (ceiling 660)
# - weekly run: 20-55 (ceiling 225). An idle month is four or five of these plus Build's nightly
#   plan job (about 30): about 120-270 in all, the top only if every weekly run starts cold.
#
# Runner labels name their OS version (ubuntu-24.04, windows-2025, macos-26); lint-workflows.sh
# rejects the -latest labels. GitHub moves a -latest label to a new OS over weeks, during which the
# same commit can land on either image, and the Rust cache key does not name the image, so each
# image would restore the other's build. Move a label on purpose, when GitHub deprecates its image.
#
# Manual runs (Actions > CI > Run workflow, or `gh workflow run ci.yml --ref <branch>`) work only once
# this file is on the default branch: GitHub ignores workflow_dispatch for a workflow that exists
# only on other branches. Branch pushes have no such limit, which is why they are the pre-PR path.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Milestone branches: an `m`, a digit, anything after (m0-scaffold, m6-website).
      - "m[0-9]*"
  workflow_dispatch:
  schedule:
    # The weekly run; see the top of this file. Minute 17 avoids the top of the hour, when GitHub's
    # scheduler is busiest and delays or drops runs. Jobs tell it apart by `github.event_name`.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # Pull requests and milestone-branch pushes share a group per ref, so a newer commit cancels the
  # run it makes obsolete. Every other run (main pushes, schedules, manual runs) gets a group of its
  # own: GitHub keeps one pending run per group and cancels the others even without
  # cancel-in-progress, so a shared group would drop the middle one of three queued main runs.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ride out transient network failures instead of failing a 20 minute job on one bad request.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    # One shell on every runner (Git Bash on Windows), so scripts and `--` arguments behave the
    # same everywhere. PowerShell would be the Windows default.
    shell: bash

jobs:
  # Pushes to milestone branches only: skip the whole run when an open pull request from the branch
  # gets a run of its own for this commit, as it does unless the pull request has a merge conflict
  # (.github/scripts/check-open-pr.sh). On every other event this job is skipped, and the jobs that
  # need it still run because their conditions start with `!cancelled()`.
  plan:
    name: plan
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      pull-requests: read # find the branch's open pull request and whether GitHub can merge it
    outputs:
      covered_by_pr: ${{ steps.pr.outputs.covered }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Look for an open pull request whose run covers this push
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/check-open-pr.sh

  lint:
    name: lint
    needs: plan
    # Not on the weekly run; see the top of this file.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.plan.result != 'failure' && needs.plan.outputs.covered_by_pr != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Setup steps stop the job on failure. The checks after them carry `!cancelled()` so a failing
    # check does not hide the others (one run reports every problem), and they wait for
    # `steps.ready`, the last setup step, so they never run on a half-built environment.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v6.1.0 added pnpm 12 support (the floating v6 tag still pointed at v6.0.10 when this was
      # pinned). No `version` input, so the version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml selects the stable channel with clippy and rustfmt, and this installs
      # exactly that up front (the runner image's preinstalled stable lags behind). rustup still
      # applies the file to every cargo call, so if it is ever pinned to a version, rustup installs
      # that version on its own; change `toolchain` to match to skip the extra download. Pinned to
      # a commit, the action can no longer read the toolchain from its ref name, hence `toolchain`.
      - name: Set up Rust
        id: ready
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test (TypeScript)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm test

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --all --check

      # The spike docs against the code, lockfiles and generated bindings they cite
      # (docs/spikes/doc-check). It only reads the checkout, so nothing has to be built first.
      - name: Check the spike docs
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test --manifest-path docs/spikes/doc-check/Cargo.toml --locked

      # Every action pinned to a commit, every runner label naming an OS version, and every
      # schedule comparison naming a scheduled cron.
      - name: Check the workflows
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/lint-workflows.sh

      - name: Check the CI scripts (ShellCheck)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: shellcheck -x .github/scripts/*.sh

      - name: Test the CI scripts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/test.sh

  # The render-power spike's Windows suite (docs/spikes/render-power) is plain PowerShell that has
  # to run under both Windows PowerShell 5.1, which every Windows PC has, and PowerShell 7. Its unit
  # tests need no build, so they get a job of their own: no Rust failure, setup step or timeout can
  # skip them, and they report within minutes.
  powershell:
    name: powershell (windows-2025)
    needs: plan
    # Not on the weekly run; see the top of this file.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.plan.result != 'failure' && needs.plan.outputs.covered_by_pr != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      # The scripts reach the PC as raw downloads from GitHub, with the repository's LF line
      # endings, so test those bytes rather than Git for Windows' CRLF conversion of them.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/spikes/render-power

      # `-File`, so the script's own exit code (1 when a test fails) fails the step.
      - name: Test the render-power suite (Windows PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File docs/spikes/render-power/test-render-power.ps1

      - name: Test the render-power suite (PowerShell 7)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pwsh -NoProfile -File docs/spikes/render-power/test-render-power.ps1

  rust:
    name: rust (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.covered_by_pr != 'true' }}
    strategy:
      # Let Linux finish when Windows fails (and the reverse): the developer cannot reproduce
      # Windows locally, so every result from a run is worth having.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    # A cold Windows run (two vCPUs for private repos) compiles the workspace for clippy, for the
    # tests and for the smoke build; 75 minutes leaves room for that.
    timeout-minutes: 75
    # Shared with rust-macos through a YAML anchor, so the two jobs cannot drift apart. Steps
    # branch on `runner.os`, never on `matrix`, because rust-macos has no matrix. Same setup and
    # check pattern as the lint job.
    steps: &rust_steps
      - name: Keep LF line endings (Windows)
        # Git for Windows checks text files out with CRLF by default. Byte-comparing tests, the
        # bindings check and the bash scripts in .github/scripts would then break on differences
        # that do not exist in the repository. (This comment sits inside the step because zizmor
        # 1.31 crashes on a comment placed between an anchor and the first item of the anchored
        # list.)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri v2's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux), plus Xvfb
      # for the smoke run's display.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      # See the note on this step in the lint job.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Pushes (main and milestone branches) and main's weekly and manual runs write the cache;
      # before a branch's first merge, main has none to offer it. Pull requests restore main's
      # entries but never save their own, so PR runs cannot evict main's from the repository's
      # 10 GB quota. The weekly run's Windows leg only reads: it runs clippy alone, and rust-cache
      # never rewrites an entry it restored exactly, so a clippy-only save would leave every later
      # Windows run with the same key rebuilding the tests, the spike and the smoke build. Saving
      # after a failure keeps the dependency cache current when a new toolchain breaks the build.
      # The last setup step, so the checks below wait for it.
      - name: Cache Rust build
        id: ready
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            docs/spikes/windows-spawn -> target
            docs/spikes/claude-control -> target
          save-if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'push') && (github.event_name != 'schedule' || runner.os != 'Windows') }}
          cache-on-failure: true

      # `--locked` fails the run when Cargo.lock is stale instead of silently re-resolving it.
      # Nothing up to the smoke steps needs the frontend: without the custom-protocol feature (only
      # `tauri build` turns it on), `generate_context!` embeds no assets while devUrl is set.
      - name: Clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The weekly run's Windows leg ends here, after clippy; see the top of this file. Every check
      # below waits for this step rather than for `steps.ready`, so that leg skips them all, while
      # on every other run a failed clippy still hides nothing.
      - name: Continue after clippy (not on the weekly Windows run)
        id: full
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && (github.event_name != 'schedule' || runner.os != 'Windows') }}
        run: echo "Running the remaining checks on $RUNNER_OS."

      # `--no-fail-fast`: cargo otherwise stops at the first failing test binary, hiding failures in
      # the remaining crates (the expensive kind to discover one push at a time on Windows).
      - name: Test
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast

      # Regenerates apps/desktop/src/bindings.ts and fails if the committed file differs. Running
      # on every OS also catches commands that only exist behind a `#[cfg]`, which would make the
      # shared TypeScript file depend on the platform that generated it.
      - name: Check generated TypeScript bindings
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: |
          log="$(mktemp)"
          cargo test --locked -p auracode-desktop export_bindings -- --color never | tee "$log"
          # A renamed, ignored or deleted test would otherwise turn this check into a silent no-op.
          if ! grep -Eq '^test [^ ]*export_bindings[^ ]* \.\.\. ok' "$log"; then
            echo "::error::No passing test matching 'export_bindings' ran in auracode-desktop, so bindings.ts was not regenerated."
            exit 1
          fi
          # `git diff` ignores untracked files, so a never-committed bindings.ts would pass it.
          if ! git ls-files --error-unmatch apps/desktop/src/bindings.ts > /dev/null; then
            echo "::error file=apps/desktop/src/bindings.ts::bindings.ts is not committed. Run 'cargo test -p auracode-desktop export_bindings' and commit it."
            exit 1
          fi
          if ! git diff --exit-code -- apps/desktop/src/bindings.ts; then
            echo "::error file=apps/desktop/src/bindings.ts::bindings.ts is out of date. Run 'cargo test -p auracode-desktop export_bindings' and commit the result."
            exit 1
          fi

      # The Windows spawning spike, on Windows and Linux. Its integration tests run from a staged
      # folder (.github/scripts/stage-spawn-spike.sh), the same folder Windows uploads so the
      # manual checklist in docs/spikes/windows-spawn.md runs on a PC without Rust. The C runtime is
      # linked statically on Windows, so those executables do not need the Visual C++
      # Redistributable on that PC.
      - name: Build the Windows spawning spike
        id: spawn-build
        if: ${{ !cancelled() && steps.full.outcome == 'success' && runner.os != 'macOS' }}
        timeout-minutes: 20
        env: &spawn_env
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: >-
          cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --no-run
          --message-format=json-render-diagnostics > "$RUNNER_TEMP/windows-spawn-build.jsonl"

      - name: Test the Windows spawning spike (unit tests)
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        timeout-minutes: 10
        env: *spawn_env
        run: cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --lib --bins

      - name: Stage the Windows spawning spike
        id: spawn-stage
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        run: >-
          bash .github/scripts/stage-spawn-spike.sh "$RUNNER_TEMP/windows-spawn-build.jsonl"
          "$RUNNER_TEMP/windows-spawn-spike"

      # From the staged folder, where the helpers are no longer at their build paths, so this also
      # proves the artifact works on its own. The step timeout caps a hung child process, which
      # would otherwise burn the whole job timeout at the Windows 2x rate.
      - name: Test the Windows spawning spike (integration tests)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/windows-spawn-spike
        env:
          TEST_EXE: ${{ steps.spawn-stage.outputs.test_exe }}
        run: '"$TEST_EXE"'

      # Uploaded even when the tests failed: a failure is exactly when the manual check on a real
      # PC matters most.
      - name: Upload the Windows spawning spike (Windows)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spawn-spike-${{ github.sha }}
          path: ${{ runner.temp }}/windows-spawn-spike
          if-no-files-found: error
          retention-days: 7
          # A re-run of the job uploads again under the same name.
          overwrite: true

      # Compile only, never run: running it would drive a real Claude Code session, which needs
      # the CLI, an account and quota, none of which belong in CI.
      - name: Build the Claude control spike (compile only)
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo build --manifest-path docs/spikes/claude-control/Cargo.toml --locked

      # Its unit tests do run: the test harness, never the spike's `main`. They feed the framing,
      # protocol and redaction code canned input and stand /bin/sh in for claude, so they need
      # neither the CLI nor the network. Linux only: the logic is the same everywhere, and the
      # process tests are Unix-only.
      - name: Test the Claude control spike (unit tests)
        if: ${{ !cancelled() && steps.full.outcome == 'success' && runner.os == 'Linux' }}
        run: cargo test --manifest-path docs/spikes/claude-control/Cargo.toml --locked

      # The smoke runs, on Windows and Linux: the app with its frontend embedded drives a real
      # webview (WebView2; WebKitGTK under Xvfb) through the typed commands and channels and reports
      # the result (.github/scripts/run-smoke.sh). They have their own JS setup down here, so a
      # TypeScript error (the lint job reports those) cannot skip the Rust checks above.
      - name: Set up pnpm (smoke)
        id: pnpm
        if: ${{ !cancelled() && steps.full.outcome == 'success' && runner.os != 'macOS' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (smoke)
        id: node
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (smoke)
        id: js
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      # A debug build without bundles. `tauri build` runs the frontend build (beforeBuildCommand)
      # and turns on the custom-protocol feature that embeds it; most dependencies are already
      # compiled for the tests.
      - name: Build the app with its frontend embedded (smoke)
        id: smoke-build
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        timeout-minutes: 30
        run: pnpm --filter @auracode/desktop tauri build --debug --no-bundle

      # The stream check: a demo turn, a cancelled turn and a stress burst. Xvfb has no GPU and no
      # DRM device for WebKitGTK's DMA-BUF renderer, so the variable keeps WebKitGTK on its
      # shared-memory path instead of relying on its detection. The screen fits the window's
      # default size. The app's own watchdog ends a stuck run after 120 s.
      - name: Smoke test the app (streams)
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" bash .github/scripts/run-smoke.sh target/debug/auracode stream
          else
            bash .github/scripts/run-smoke.sh target/debug/auracode.exe stream
          fi

      # The chat screens against the demo agent (apps/desktop/src/lib/smokeChat.ts), in two launches
      # on one data folder with the quit flow between them: every check is printed. It runs after a
      # failed stream check too. The app's watchdogs end a stuck launch after 300 s and 120 s, so
      # the timeout covers both with room for startup. CI never sets AURACODE_SMOKE_AGENT, which
      # runs a real agent; run-smoke.sh refuses it here anyway.
      - name: Smoke test the chat UI
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" bash .github/scripts/run-smoke.sh target/debug/auracode chat
          else
            bash .github/scripts/run-smoke.sh target/debug/auracode.exe chat
          fi

      # A cancelled job (superseded by a newer push, or out of time) stops half-built. rust-cache's
      # post step saves when the job succeeded or when CACHE_ON_FAILURE, which it exports from
      # `cache-on-failure`, is true, so it would save that half-built target. Later runs with the
      # same key would restore it, rebuild the rest and never save the whole, since rust-cache does
      # not rewrite an entry it matched exactly. Turning the variable off skips that save.
      - name: Keep a cancelled build out of the cache
        if: cancelled()
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"

  rust-macos:
    name: rust (macos-26)
    # Main pushes and manual runs only: see the top of this file. Never skipped as a duplicate,
    # since the `plan` job only runs for milestone-branch pushes, which this job ignores.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # A cold run (clippy, then the tests' full build) takes about 15 minutes on the macOS runner
    # (3 cores). 40 leaves room for a slow one and caps a hung run at 400 included minutes.
    timeout-minutes: 40
    steps: *rust_steps
