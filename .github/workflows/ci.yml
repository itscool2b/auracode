# Deliberate integration and final verification only. Routine commits and pushes run no CI.
# The active product targets are Windows and macOS. Linux/WSL are deferred.
name: CI

on:
  workflow_dispatch:
    inputs:
      refresh_bindings:
        description: Generate bindings on macOS before frontend checks and publish parity artifacts
        type: boolean
        default: false
        required: false
      encrypted_storage:
        description: Verify SQLCipher and account sync on both platforms (enable for final verification)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  bindings:
    name: bootstrap bindings (macOS)
    if: inputs.refresh_bindings
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Export exact bindings
        run: bash .github/scripts/export-bindings.sh refresh "$RUNNER_TEMP/bindings-bootstrap"
      - name: Publish exact generated bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/bindings-bootstrap/bindings.ts
          if-no-files-found: error
          retention-days: 7
  lint:
    name: lint
    needs: bindings
    if: ${{ !cancelled() && (needs.bindings.result == 'success' || needs.bindings.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use generated bindings for this explicit refresh run
        if: inputs.refresh_bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: apps/desktop/src
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        id: ready
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test (TypeScript)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm test

      - name: Build and verify the Rust cloud runtime
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.8.7 --locked
          pnpm --filter @auracode/api worker:build
          pnpm --filter @auracode/api worker:test

      - name: Install browser test engines
        id: browsers
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: pnpm --filter @auracode/desktop exec playwright install --with-deps chromium webkit

      - name: Check Orbit in Chromium and WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm --filter @auracode/desktop check:orbit

      - name: Check settings and explicit update controls
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm --filter @auracode/desktop check:settings

      - name: Check Library and configuration recovery
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          pnpm --filter @auracode/desktop exec node scripts/check-library.mjs
          pnpm --filter @auracode/desktop exec node scripts/check-config-recovery.mjs

      - name: Check website accounts and verified release downloads
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          pnpm --filter @auracode/web test:release
          pnpm --filter @auracode/web test:browser

      - name: Keep account, Library and website browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-library-web-browser
          path: |
            target/library-browser
            target/config-recovery-browser
            target/web-checks
            target/release-preview-*/*.png
          retention-days: 7

      - name: Keep Orbit browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-browser
          path: target/orbit-browser
          retention-days: 7

      - name: Keep settings and Git review evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-browser
          path: target/settings-browser
          retention-days: 7

      - name: Check setup in Chromium and WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm --filter @auracode/desktop check:setup
      - name: Keep setup browser evidence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-browser
          path: target/setup-browser
          retention-days: 7

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --all --check
      - name: Check the spike docs
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test --manifest-path docs/spikes/doc-check/Cargo.toml --locked
      - name: Check the workflows
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash .github/scripts/lint-workflows.sh

      - name: Install ShellCheck if needed
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: Check the CI scripts (ShellCheck)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: shellcheck -x .github/scripts/*.sh

      - name: Test the CI scripts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          bash .github/scripts/test.sh
          bash .github/scripts/test-export-bindings.sh
  powershell:
    name: powershell (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/spikes/render-power
      - name: Test the render-power suite (Windows PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File docs/spikes/render-power/test-render-power.ps1

      - name: Test the render-power suite (PowerShell 7)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pwsh -NoProfile -File docs/spikes/render-power/test-render-power.ps1

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/select-native-perl.ps1
      - name: Cache Rust build
        id: ready
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            docs/spikes/windows-spawn -> target
            docs/spikes/claude-control -> target
          cache-on-failure: true
      - name: Clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Continue with remaining checks
        id: full
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: echo "Running the remaining checks on $RUNNER_OS."
      - name: Test
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: Check generated TypeScript bindings
        id: bindings
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        env:
          BINDINGS_MODE: ${{ inputs.refresh_bindings && 'refresh' || 'check' }}
        run: bash .github/scripts/export-bindings.sh "$BINDINGS_MODE" "$RUNNER_TEMP/bindings-$RUNNER_OS"
      - name: Publish independently generated bindings
        if: ${{ !cancelled() && steps.bindings.outputs.generated == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bindings-${{ runner.os }}/bindings.ts
          if-no-files-found: error
          retention-days: 7
      - name: Build the Windows spawning spike
        id: spawn-build
        if: ${{ !cancelled() && steps.full.outcome == 'success' && runner.os != 'macOS' }}
        timeout-minutes: 20
        env: &spawn_env
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: >-
          cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --no-run
          --message-format=json-render-diagnostics > "$RUNNER_TEMP/windows-spawn-build.jsonl"

      - name: Test the Windows spawning spike (unit tests)
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        timeout-minutes: 10
        env: *spawn_env
        run: cargo test --manifest-path docs/spikes/windows-spawn/Cargo.toml --locked --lib --bins

      - name: Stage the Windows spawning spike
        id: spawn-stage
        if: ${{ !cancelled() && steps.spawn-build.outcome == 'success' }}
        run: >-
          bash .github/scripts/stage-spawn-spike.sh "$RUNNER_TEMP/windows-spawn-build.jsonl"
          "$RUNNER_TEMP/windows-spawn-spike"
      - name: Test the Windows spawning spike (integration tests)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/windows-spawn-spike
        env:
          TEST_EXE: ${{ steps.spawn-stage.outputs.test_exe }}
        run: '"$TEST_EXE"'
      - name: Upload the Windows spawning spike (Windows)
        if: ${{ !cancelled() && steps.spawn-stage.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spawn-spike-${{ github.sha }}
          path: ${{ runner.temp }}/windows-spawn-spike
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Build the Claude control spike (compile only)
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo build --manifest-path docs/spikes/claude-control/Cargo.toml --locked
      - name: Test the Claude control spike (unit tests)
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: cargo test --manifest-path docs/spikes/claude-control/Cargo.toml --locked
      - name: Set up pnpm (smoke)
        id: pnpm
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (smoke)
        id: node
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies (smoke)
        id: js
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: pnpm install --frozen-lockfile
      - name: Build the app with its frontend embedded (smoke)
        id: smoke-build
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        timeout-minutes: 30
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm --filter @auracode/desktop tauri build --debug --no-bundle
      - name: Smoke test the app (streams)
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          binary=target/debug/auracode
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          bash .github/scripts/run-smoke.sh "$binary" stream
      - name: Smoke test the chat UI
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          binary=target/debug/auracode
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          bash .github/scripts/run-smoke.sh "$binary" chat
      - name: Keep native smoke evidence
        if: ${{ !cancelled() && steps.smoke-build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/auracode-smoke*.stdout
          if-no-files-found: warn
          retention-days: 7
      - name: Keep a cancelled build out of the cache
        if: cancelled()
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"
  encrypted-storage:
    name: encrypted storage (${{ matrix.os }})
    if: inputs.encrypted_storage
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/select-native-perl.ps1
      - name: Cache encrypted build
        id: ready
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: encrypted-storage
          cache-on-failure: true
      - name: Test SQLCipher and sync client
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test -p aura-sync --features sqlcipher --lib --locked
      - name: Test encrypted core, files, checkpoints and sync ledger
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test -p aura-core --features account-sync --lib --locked
      - name: Clippy sync client with SQLCipher
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy -p aura-sync --features sqlcipher --all-targets --locked -- -D warnings
      - name: Clippy core with account sync
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy -p aura-core --features account-sync --all-targets --locked -- -D warnings
  bindings-parity:
    name: generated binding parity
    needs: [bindings, rust]
    if: ${{ !cancelled() && inputs.refresh_bindings && needs.bindings.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Read macOS bootstrap bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-bootstrap-${{ github.sha }}
          path: bootstrap
      - name: Read independently generated Windows bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-Windows-${{ github.sha }}
          path: windows
      - name: Compare exact output across platforms
        run: cmp bootstrap/bindings.ts windows/bindings.ts
