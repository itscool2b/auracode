# Unsigned desktop bundles (macOS, Windows, Linux): for every push to main, nightly when main's head
# still has none, on demand, and for milestone branches on request.
#
# Unsigned for now: signing (code signatures and the updater's signatures) comes in M5, along
# with universal macOS and Windows arm64 installers. Until then these installers are for testing
# only. On macOS, the first launch is blocked; allow it in System Settings > Privacy & Security >
# Open Anyway (macOS 15 removed the right-click > Open shortcut). On Windows, SmartScreen needs
# "More info > Run anyway". On Linux, `chmod +x` the AppImage after download.
#
# Cost: macOS minutes bill at 10x and Windows at 2x in this private repo, and these are release
# builds, so this workflow never runs on pull requests, and:
# - The nightly builds main's head only when no run has built its bundles (a push to main already
#   does) and no earlier nightly tried it; the `plan` job decides, from the API
#   (.github/scripts/plan-nightly-bundle.sh). An idle day costs one minute of Linux.
# - Milestone branches (m0-scaffold, ...) build only when the newest commit of a push has [bundle] in
#   its message, for example `git commit --allow-empty -m "Build installers [bundle]"`, and then only
#   Windows and Linux (the developer builds macOS locally). That is how Windows installers for the
#   manual checks exist before the branch's pull request does. Other branch pushes show up here as
#   skipped runs, which cost nothing.
# - Manual runs (Actions > Build > Run workflow, or `gh workflow run build.yml --ref <branch>`) build
#   all three, but only once this file is on the default branch: GitHub ignores workflow_dispatch
#   for a workflow that exists only on other branches.
#
# In included minutes (each job rounded up to whole minutes, then multiplied; warm means main's Rust
# cache is usable, cold means it is not, as after a new Rust stable; the ceiling is every job
# running to its timeout), a bundle costs 70-180 on macOS, 30-100 on Windows and 10-30 on Linux.
# Per event, warm to cold:
# - main push or manual run: 110-310 (ceiling 720)
# - nightly: 1 (ceiling 5) when main's head has its bundles or a nightly already tried it, as on
#   every idle night; otherwise, at most once per commit, 1 plus a main push's worth
# - milestone-branch push with [bundle]: 40-130 (ceiling 270); without it, nothing
# - pull requests and CI's weekly run: nothing, since neither starts this workflow
# Runner labels name their OS version, as in ci.yml (its header says why).
name: Build

on:
  push:
    branches:
      - main
      # Milestone branches, as in ci.yml; they build only on request (see above).
      - "m[0-9]*"
  workflow_dispatch:
  schedule:
    # Nightly. Off the top of the hour (GitHub's scheduler delays or drops runs there), and outside
    # the 14:00 to 24:00 UTC brownout windows GitHub has announced for ubuntu-22.04 in March and
    # April 2027.
    - cron: "43 6 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  # Scheduled runs only. On every other event this job is skipped, and `bundle` still runs because
  # its condition starts with `!cancelled()`.
  plan:
    name: plan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      actions: read # list this workflow's runs for the commit and their jobs
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Decide whether main's head needs bundles
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_FILE: build.yml
          # The bundle jobs' names up to their matrix value: keep in step with `bundle` below.
          BUNDLE_JOB_PREFIX: "bundle ("
        run: bash .github/scripts/plan-nightly-bundle.sh

  bundle:
    name: bundle (${{ matrix.os }})
    needs: plan
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'schedule' && needs.plan.outputs.build == 'true') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[bundle]')))
      ) }}
    # Per job rather than per workflow, so only runs that build compete. A newer build for the same
    # branch and OS cancels the older one (only the newest bundles matter, and a superseded macOS
    # build is the most expensive kind of wasted minute), while a branch push without [bundle] or a
    # nightly that decides to skip never cancels a build in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Milestone branches skip macOS; see the top of this file. Linux builds on ubuntu-22.04, not
        # on ubuntu-24.04 like CI: a binary needs at least the glibc it was linked against, which
        # matters most for the AppImage, and Tauri's AppImage guide says to build on the oldest
        # system you support (its example is Ubuntu 22.04). GitHub deprecated this image on
        # 2026-09-17 and retires it on 2027-04-17; move the Linux build (for example into a Debian
        # 12 or Ubuntu 22.04 container) before then.
        os: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["windows-2025","ubuntu-22.04"]' || '["macos-26","windows-2025","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    # Release builds: a cold one takes about 20 minutes on the macOS runner (3 cores) and two to
    # three times that on Windows (2 vCPUs). macOS gets the shorter limit, which caps a hung build
    # at 450 included minutes.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 45 || 90 }}
    steps:
      # Same reason as in CI: keep the bytes that go into the bundle identical to the repository.
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri v2's Linux prerequisites: https://v2.tauri.app/start/prerequisites/#linux
      # The AppImage needs nothing extra: Tauri runs linuxdeploy with APPIMAGE_EXTRACT_AND_RUN (no
      # FUSE), patchelf is only used by the GStreamer plugin we do not enable, and xdg-open
      # bundling was removed in Tauri 2.12.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # Matches rust-toolchain.toml (stable with clippy and rustfmt); see the note in ci.yml.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main writes the cache: release caches are large, and builds on milestone branches are
      # occasional, so their entries would mostly push main's out of the 10 GB quota.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # v6.1.0 added pnpm 12 support (the floating v6 tag still pointed at v6.0.10 when this was
      # pinned). The version comes from `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build` also runs the configured beforeBuildCommand. Building here first keeps a
      # frontend failure in its own clearly named step, and guarantees apps/desktop/dist exists
      # even if that hook is missing; a second build of the frontend costs seconds.
      - name: Build the frontend
        run: pnpm --filter @auracode/desktop build

      # tauri.conf.json names no signing identity: `pnpm bundle` (apps/desktop/scripts/bundle.mjs)
      # chooses one for each build and hands it to `tauri build` as APPLE_SIGNING_IDENTITY. A runner
      # has no identity, so the job chooses ad hoc ("-") itself, which bundle.mjs passes on as it
      # is instead of searching the keychain and warning. Ad hoc is not a real signature (no
      # identity, no notarization, and Gatekeeper still treats the app as unsigned), but Apple
      # Silicon refuses to launch a downloaded bundle with no signature at all ("is damaged").
      - name: Use an ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      # Through `pnpm bundle`, the entry point local release builds use, so CI builds the same way
      # and exercises bundle.mjs on every OS. On Windows and Linux it is plain `tauri build`.
      - name: Build unsigned bundles
        run: pnpm --filter @auracode/desktop bundle

      - name: Name the artifact
        id: artifact
        run: |
          os="$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")"
          arch="$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_ARCH")"
          echo "name=auracode-${GITHUB_SHA::7}-${os}-${arch}" >> "$GITHUB_OUTPUT"

      # The installers from the bundle directories (Tauri writes them to the workspace target dir).
      # Not the whole directories: artifact uploads drop file permissions, so a raw macOS .app
      # would arrive broken (the DMG carries it intact), and the AppImage's .AppDir staging tree
      # is large scratch output. Installers are already compressed, so zipping them again only
      # costs time.
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # A re-run of the job uploads again under the same name.
          overwrite: true

      # A build cancelled by a newer one for the same branch and OS (see `concurrency` above), or by
      # its timeout, stops half-built, and rust-cache would save it anyway because of
      # `cache-on-failure`. Same guard and reasons as at the end of ci.yml's rust job.
      - name: Keep a cancelled build out of the cache
        if: cancelled()
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"
