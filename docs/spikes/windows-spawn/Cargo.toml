[package]
name = "windows-spawn"
description = "M0 spike: start agent processes without console windows and kill their whole process tree"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "LicenseRef-Proprietary"

# Standalone on purpose: spikes are experiments with their own lockfile, and the root manifest
# excludes docs/spikes from the main workspace.
[workspace]

[dependencies]
# Owns the platform-specific spawn mechanics: Job Object + CREATE_NO_WINDOW on Windows, a new
# process group on Unix. Default features are off so only the wrappers we use are compiled.
process-wrap = { version = "10.0.1", default-features = false, features = [
  "tokio1",
  "creation-flags",
  "job-object",
  "kill-on-drop",
  "process-group",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# The same `windows` major version process-wrap uses, so its `CreationFlags` type lines up.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

# Mirrors the main workspace's lints (this crate is outside it), plus expect_used, so the code can
# move into aura-core unchanged.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
