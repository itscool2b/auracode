[package]
name = "claude-control-spike"
description = "M0 spike: drives the installed Claude Code over its stream-json control protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# A root of its own on purpose: the product workspace excludes docs/spikes, and this empty table
# keeps cargo from walking up to it, so the spike never touches the product lockfile or build.
[workspace]

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7"] }

# Same bar as the product workspace, so code lifted into aura-drivers needs no cleanup.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
