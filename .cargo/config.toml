# Release bundles must also run on CPUs older than the build host. Whisper is CPU-only and
# statically linked; do not let ggml emit host-specific instructions into distributed binaries.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_SSE42 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
# whisper-rs-sys forwards these to CMake. Keep its C/C++ runtime in the static library too;
# otherwise the Windows app imports MSVCP140.dll without shipping that prerequisite.
# CMP0091 enables the property for whisper.cpp's older minimum CMake version. Non-MSVC
# platforms ignore this property; Rust and the other native dependencies keep their settings.
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
