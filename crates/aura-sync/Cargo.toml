[package]
name = "aura-sync"
description = "Account transport, end-to-end encryption and local-first sync for auracode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
keyring-core = "1.0.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tempfile.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
