[package]
name = "aura-sync"
description = "Account transport, end-to-end encryption and local-first sync for auracode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
sqlcipher = ["dep:rusqlite"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
keyring-core = "1.0.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# The data cleanup's sweep of auracode's own Credential Manager targets (vault.rs). Raw bindings,
# already in the tree; the keyring store's own search would read every credential's metadata.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher"] }

[lints]
workspace = true
