[package]
name = "aura-drivers"
description = "Agent drivers for auracode: the frame batcher every driver shares and a scripted mock agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aura-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7.20"
tracing.workspace = true
# Grapheme boundaries, so a split delta never cuts an emoji sequence or an accent off its letter.
unicode-segmentation = "1.13.3"

[dev-dependencies]
# Paused time makes the pacing and cancellation tests deterministic.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
