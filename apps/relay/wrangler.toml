# The remote-sessions relay: one Durable Object per desktop, holding its sockets. It stores only
# the hash of a desktop's key and the hashes of its bot tokens; no D1, R2, KV or secrets.
# Default bindings are local-only. Production requires explicit --env production.
name = "auracode-relay-local"
main = "src/index.ts"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false

[vars]
APP_ORIGIN = "http://localhost:1429"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false

[env.production]
name = "auracode-relay"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
# More specific than the API's `auracode.si/api/*`, so these requests reach this Worker.
routes = [{ pattern = "auracode.si/api/remote/*", zone_name = "auracode.si" }]

[env.production.vars]
APP_ORIGIN = "https://auracode.si"

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.preview]
name = "auracode-relay-preview"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
routes = [{ pattern = "preview.auracode.si/api/remote/*", zone_name = "auracode.si" }]

[env.preview.vars]
APP_ORIGIN = "https://preview.auracode.si"

[[env.preview.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
