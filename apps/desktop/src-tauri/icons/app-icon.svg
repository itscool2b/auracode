<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>auracode</title>
  <!-- The Graphite app icon: the pixel "a" of PIXEL_MARK_GRID in fg-1 with one volt cursor pixel,
       on a black tile that follows the macOS grid (an 824 px body inset 100 px, radius 185, so
       the system shadow has room). Cells are 64 px and sit on multiples of 64, so every power-of-two
       size from 1024 down to 16 lands each pixel on whole device pixels. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#2e2e2e" stroke-width="4"/>
  <g shape-rendering="crispEdges">
    <path fill="#ededed" d="M320 320h256v64H320zM576 384h64v64h-64zM320 448h320v64H320zM256 512h64v64h-64zM576 512h64v64h-64zM256 576h64v64h-64zM576 576h64v64h-64zM320 640h320v64H320z"/>
    <path fill="#ccff33" d="M704 640h64v64h-64z"/>
  </g>
</svg>
