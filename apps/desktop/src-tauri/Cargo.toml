[package]
name = "auracode-desktop"
description = "The auracode desktop shell: Tauri window, typed commands and channels over aura-core's sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "auracode"

# The library holds everything (so tests and the bindings export can reach it); the binary only
# calls `run`. They have different names on purpose: a bin and a lib that share a name collide on
# Windows debug artifacts.
[lib]
name = "auracode_desktop"
path = "src/lib.rs"

[[bin]]
name = "auracode"
path = "src/main.rs"

[build-dependencies]
# Embeds the Windows application manifest in test binaries too (build.rs). Already in the tree
# through tauri-build's resource compiler, at this version.
embed-resource = "3.0.12"
tauri-build.workspace = true

[dependencies]
aura-agents.workspace = true
aura-config.workspace = true
aura-core = { workspace = true, features = ["account-sync"] }
aura-drivers.workspace = true
aura-process.workspace = true
aura-protocol.workspace = true
aura-sync.workspace = true
zeroize = "1.9.1"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }
reqwest.workspace = true
# Native TLS matches the rest of the desktop; signed-version verification is required.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# Same release aura-drivers uses: its `run_script` takes a `CancellationToken`.
tokio-util = "0.7.20"
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keepawake = "=0.6.1"
tauri-plugin-notification = "=2.7.0"

[target.'cfg(windows)'.dependencies]
# Already in the tree through tao and window-vibrancy; it reads the real build number (Mica needs
# build 22000+) without the compatibility shims that make GetVersionEx lie.
windows-version = "0.1.7"
# The data cleanup mode (uninstall.rs): its dialogs, attaching to a terminal, waiting for the app
# to exit; and the window caption's colours (window.rs). Raw bindings, already in the tree.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# "Delete data and move auracode to the Trash" (uninstall.rs): NSFileManager's trashItemAtURL.
# Already in the tree through Tauri, at this version.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
# The quit, page-load and signal tests run the session manager on fake processes and scripted drivers.
aura-drivers = { workspace = true, features = ["testing"] }
aura-process = { workspace = true, features = ["testing"] }
# Paused time makes the window fallback and the demo stream tests instant and deterministic.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
