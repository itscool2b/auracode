# Static assets only. All application API behavior is the separate Rust Worker on /api/*.
name = "auracode-web-local"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false
[assets]
directory = "./build/client"
not_found_handling = "404-page"
[env.production]
name = "auracode-web"
account_id = "5feb14f2fe605875bcf1472f348cb7ed"
routes = [{ pattern = "auracode.si/*", zone_name = "auracode.si" }]
[env.production.assets]
directory = "./build/client"
not_found_handling = "404-page"
